<div class="modal-fondo" (click)="cerrar.emit()">
  <div class="modal-caja" (click)="$event.stopPropagation()">
    <div class="d-flex justify-content-between align-items-start pb-3 mb-4 border-bottom">
      <div>
        <h3>{{ salon ? 'Editar salón' : 'Nuevo salón' }}</h3>
        <small class="texto-suave">
          @if (salon) { <span class="id">S-{{salon.idSalon}}</span> · }
          Los campos con * son obligatorios
        </small>
      </div>
      <button type="button" class="cerrar" (click)="cerrar.emit()"><i class="bi bi-x-lg"></i></button>
    </div>

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="mb-3">
        <label class="campo">Nombre *</label>
        <input type="text" formControlName="nombre" class="form-control" maxlength="50">
        @if (form.get('nombre')?.touched && form.get('nombre')?.invalid) {
          <small class="text-danger">Obligatorio, máximo 50 caracteres</small>
        }
      </div>
      <div class="row g-3">
        <div class="col-sm-6">
          <!-- dato calculado por el backend: no se edita -->
          <label class="campo">Cantidad de mesas</label>
          <input type="number" class="form-control" [value]="salon?.cantidadMesas ?? 0" disabled>
          <small class="texto-suave">Se calcula con las mesas asignadas</small>
        </div>
        <div class="col-sm-6">
          <label class="campo">Estado *</label>
          <select formControlName="estado" class="form-select">
            <option value="DISPONIBLE">Disponible</option>
            <option value="NO_DISPONIBLE">No disponible</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 border-top pt-4 mt-4">
        <button type="button" class="btn-claro" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit" class="btn-vimalu" [disabled]="form.invalid || guardando">
          <i class="bi bi-check-circle"></i> {{ salon ? 'Guardar cambios' : 'Registrar salón' }}
        </button>
      </div>
    </form>
  </div>
</div>
