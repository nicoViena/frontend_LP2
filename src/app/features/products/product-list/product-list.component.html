<div class="container mt-4">
    <div  class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-vimalu-primary">Gestion de Productos</h2>
        <a routerLink="/productos/nuevo" class="btn btn-success">Nuevo Producto</a>
    </div>
    <table class="table table-hover shadow-sm">
        <thead class="bg-vimalu-primary text-white">
            <tr>
                <th>Imagen</th>
                <th>Nombres</th>
                <th>Categoria</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            @for (p of productos; track p.idProducto){
                <tr>
                    <td>
                        @if (p.imagen) {
                            <img [src]="p.imagen" width="50" class="rounded">
                        } @else {
                            <i class="bi bi-image text-muted fs-3"></i>
                        }
                    </td>
                    <td>{{p.nombre}}</td>
                    <td>{{p.categoria}}</td>
                    <td>{{p.precio}}</td>
                    <td>{{p.stock}}</td>
                    <td>
                        <a [routerLink]="['/productos/editar', p.idProducto]" class="btn btn-sm btn-warning me-2">Editar</a>
                        <button (click)="eliminar(p.idProducto!)" class="btn btn-sm btn-danger">Eliminar</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>
